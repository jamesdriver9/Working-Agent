services:
  workspace-agent:
    build: .
    container_name: gdrive_intel_agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GCP_OAUTH_JSON_RAW=${GCP_OAUTH_JSON_RAW}
      - GCP_TOKEN_JSON_RAW=${GCP_TOKEN_JSON_RAW}
    volumes:
      - mcp_cache:/tmp/mcp-cache
    restart: unless-stopped

volumes:
  mcp_cache:
